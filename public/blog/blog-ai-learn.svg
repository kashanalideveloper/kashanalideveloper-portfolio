<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Become AI Dev">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- decorative rings -->
  <circle cx="1060" cy="80" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="1060" cy="80" r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- accent spine -->
  <rect x="0" y="0" width="6" height="630" fill="url(#acc)"/>

  <!-- icon tile -->
  <g transform="translate(160, 150)">
    <rect width="132" height="132" rx="28" fill="rgba(255,255,255,0.12)"/>
    <rect x="1.5" y="1.5" width="129" height="129" rx="26.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <rect x="6" y="6" width="120" height="120" rx="22" fill="#c084fc" opacity="0.10"/>
    <g transform="translate(6, 6)">
    <circle cx="60" cy="60" r="19" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.85"/>
    <circle cx="60" cy="60" r="9" fill="#c084fc" opacity="0.45"/>
    <circle cx="60" cy="60" r="3.5" fill="#fff"/>
    <path d="M60 18 L60 36 M33 30 L48 44 M87 30 L72 44 M22 60 L40 60 M80 60 L98 60 M33 90 L48 76 M87 90 L72 76 M60 84 L60 102" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/></g>
  </g>

  <!-- tag pill -->
  <rect x="160" y="330" width="64" height="30" rx="15" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="192" y="350" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" fill="#c084fc" text-anchor="middle" letter-spacing="2.5" font-weight="700">AI</text>

  <!-- title -->
  <text x="160" y="416" font-family="'Poppins','Inter','Segoe UI',sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Become</text>
  <text x="160" y="486" font-family="'Poppins','Inter','Segoe UI',sans-serif" font-size="58" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">AI Dev</text>

  <!-- subtitle -->
  <line x1="160" y1="518" x2="216" y2="518" stroke="#c084fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <text x="232" y="526" font-family="'Poppins','Inter','Segoe UI',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.72)" letter-spacing="0.5">Python · LLMs · APIs · 2026 Guide</text>

  <!-- footer brand -->
  <g transform="translate(160, 585)">
    <circle cx="8" cy="-4" r="4" fill="#c084fc" opacity="0.9"/>
    <text x="22" y="0" font-family="'JetBrains Mono','Consolas',monospace" font-size="13" fill="rgba(255,255,255,0.42)" letter-spacing="1.5">malikkashan.dev</text>
  </g>
</svg>

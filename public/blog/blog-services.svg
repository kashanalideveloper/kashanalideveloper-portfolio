<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <!-- Glow circle -->
  <circle cx="200" cy="315" r="280" fill="#0ea5e9" opacity="0.06"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Icon: code brackets -->
  <g transform="translate(160, 200)" filter="url(#glow)">
    <rect width="120" height="120" rx="24" fill="#0ea5e9" opacity="0.12"/>
    <rect x="2" y="2" width="116" height="116" rx="22" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
    <!-- Code icon -->
    <path d="M35 60 L55 40 L35 20" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M85 20 L65 40 L85 60" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="75" y1="70" x2="45" y2="100" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Category badge -->
  <rect x="160" y="355" width="130" height="28" rx="14" fill="#0ea5e9" opacity="0.15"/>
  <rect x="160" y="355" width="130" height="28" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
  <text x="225" y="374" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="2">SERVICES</text>
  <!-- Main headline -->
  <text x="160" y="430" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1">Front-End</text>
  <text x="160" y="494" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-1">Development</text>
  <text x="160" y="547" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Services in Pakistan</text>
  <!-- Right decorative -->
  <g transform="translate(780, 80)" opacity="0.3">
    <rect width="380" height="460" rx="20" fill="none" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="340" height="50" rx="10" fill="#1e293b"/>
    <rect x="20" y="85" width="200" height="12" rx="6" fill="#334155"/>
    <rect x="20" y="107" width="260" height="12" rx="6" fill="#334155"/>
    <rect x="20" y="129" width="160" height="12" rx="6" fill="#334155"/>
    <rect x="20" y="161" width="340" height="1" fill="#334155"/>
    <rect x="20" y="175" width="100" height="60" rx="8" fill="#1e293b"/>
    <rect x="135" y="175" width="100" height="60" rx="8" fill="#1e293b"/>
    <rect x="250" y="175" width="100" height="60" rx="8" fill="#1e293b"/>
    <rect x="20" y="255" width="340" height="180" rx="10" fill="#1e293b"/>
    <rect x="36" y="271" width="180" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="289" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="307" width="140" height="8" rx="4" fill="#334155"/>
  </g>
  <!-- Author line -->
  <text x="160" y="600" font-family="monospace" font-size="13" fill="#475569" letter-spacing="1">kashanalideveloper-portfolio.vercel.app</text>
</svg>
